name: Build and publish scenery content updates
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified component release immediately
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
concurrency:
  group: terrainfoundry-release
  cancel-in-progress: false
jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      component: content
      publish: ${{ inputs.publish }}
    secrets: inherit
