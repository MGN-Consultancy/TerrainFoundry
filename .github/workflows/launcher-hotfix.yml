name: Publish launcher repair
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: terrainfoundry-release
  cancel-in-progress: false
jobs:
  launcher:
    runs-on: windows-latest
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: ./scripts/release/build-launcher.ps1
      - run: ./scripts/release/test-launcher-handoff.ps1
      - run: ./scripts/release/test-launcher-lifecycle.ps1
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: ./scripts/release/sign.ps1 -File "$PWD/launcher/TerrainFoundryLauncher.exe"
      - run: node scripts/release/wix.mjs
      - run: node scripts/release/launcher-msi.mjs
      - shell: pwsh
        run: |
          $v=(Get-Content release-config/product.json -Raw | ConvertFrom-Json).launcherVersion
          ./scripts/release/sign.ps1 -File "$PWD/release/publish/TerrainFoundryLauncher-$v-win-x64.msi"
          ./scripts/release/test-launcher-msi.ps1 -File "$PWD/release/publish/TerrainFoundryLauncher-$v-win-x64.msi"
          Copy-Item launcher/TerrainFoundryLauncher.exe release/publish/TerrainFoundryLauncher.exe
      - name: Reuse verified client and scenery
        env:
          GH_TOKEN: ${{ github.token }}
          TERRAIN_RELEASE_KEY: ${{ secrets.TERRAIN_RELEASE_KEY }}
        shell: pwsh
        run: |
          gh release download --pattern channel.json --dir release/previous
          if($LASTEXITCODE -ne 0){throw 'Previous channel download failed'}
          node scripts/release/launcher-hotfix-manifest.mjs
          if($LASTEXITCODE -ne 0){throw 'Launcher channel generation failed'}
          ./scripts/release/test-launcher.ps1
      - name: Create draft launcher repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v=(Get-Content release-config/product.json -Raw | ConvertFrom-Json).launcherVersion
          gh release create "v$v" --draft --target $env:GITHUB_SHA --title "Terrain Foundry launcher $v" --notes "Fixes launcher self-update restart failures. If your old launcher keeps downloading itself, run this signed MSI once. Existing editor, scenery and saved projects are preserved. The editor remains version 1.15.0; this release updates the launcher only." release/publish/channel.json release/publish/TerrainFoundryLauncher.exe "release/publish/TerrainFoundryLauncher-$v-win-x64.msi"
          if($LASTEXITCODE -ne 0){throw 'Draft release creation failed'}
