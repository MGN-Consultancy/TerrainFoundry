name: Publish launcher update
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after checks (otherwise create draft)
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
concurrency:
  group: terrainfoundry-release
  cancel-in-progress: false
jobs:
  launcher:
    runs-on: windows-latest
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: ./scripts/release/build-launcher.ps1
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign launcher and desktop-shortcut installer
        shell: pwsh
        run: |
          ./scripts/release/sign.ps1 -File "$PWD/launcher/TerrainFoundryLauncher.exe"
          node scripts/release/wix.mjs
          if($LASTEXITCODE -ne 0){throw 'WiX setup failed'}
          node scripts/release/launcher-msi.mjs
          if($LASTEXITCODE -ne 0){throw 'MSI build failed'}
          $v=(Get-Content release-config/product.json -Raw | ConvertFrom-Json).launcherVersion
          ./scripts/release/sign.ps1 -File "$PWD/release/publish/TerrainFoundryLauncher-$v-win-x64.msi"
          ./scripts/release/test-launcher-msi.ps1 -File "$PWD/release/publish/TerrainFoundryLauncher-$v-win-x64.msi"
      - name: Reuse verified client and scenery; sign new channel
        env:
          GH_TOKEN: ${{ github.token }}
          TERRAIN_RELEASE_KEY: ${{ secrets.TERRAIN_RELEASE_KEY }}
        shell: pwsh
        run: |
          gh release download --pattern channel.json --dir release/previous --clobber
          if($LASTEXITCODE -ne 0){throw 'Previous published release is required'}
          Copy-Item release/previous/channel.json release/previous-channel.json
          node scripts/release/publish-launcher.mjs
          if($LASTEXITCODE -ne 0){throw 'Channel signing failed'}
          ./scripts/release/test-launcher.ps1
      - name: Publish launcher release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v=(Get-Content release-config/product.json -Raw | ConvertFrom-Json).launcherVersion
          $args=@('release','create',"v$v",'--target',$env:GITHUB_SHA,'--title',"Terrain Foundry $v",'--notes-file','RELEASE-NOTES.md')
          if('${{ inputs.publish }}' -ne 'true'){$args+='--draft'}
          $args+=@("release/publish/TerrainFoundryLauncher-$v-win-x64.msi",'release/publish/TerrainFoundryLauncher.exe','release/publish/channel.json')
          & gh @args
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
