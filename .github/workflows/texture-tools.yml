name: Check scenery texture tools
on:
  pull_request:
    paths: ['scripts/premium-packs/*texture*.py', 'scripts/premium-packs/compact-display-glb.py', 'tests/texture-*', '.github/workflows/texture-tools.yml']
  push:
    branches: [main]
    paths: ['scripts/premium-packs/*texture*.py', 'scripts/premium-packs/compact-display-glb.py', 'tests/texture-*', '.github/workflows/texture-tools.yml']
permissions:
  contents: read
jobs:
  texture-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/texture-tools-requirements.txt
      - run: python -m pip install -r tests/texture-tools-requirements.txt
      - run: python tests/texture-display-tools.test.py
