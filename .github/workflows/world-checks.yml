name: Check world builder
on:
  pull_request:
    paths: ['src/**', 'desktop/**', 'tests/world*', 'tests/campaign*', 'tests/scene-library*', 'tests/premium*', 'tests/print-export-validation*', 'package.json', 'pnpm-lock.yaml', '.github/workflows/world-checks.yml']
  push:
    branches: [main]
    paths: ['src/**', 'desktop/**', 'tests/world*', 'tests/campaign*', 'tests/scene-library*', 'tests/premium*', 'tests/print-export-validation*', 'package.json', 'pnpm-lock.yaml', '.github/workflows/world-checks.yml']
permissions:
  contents: read
jobs:
  world-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test tests/campaign-agent.test.mjs tests/campaign-workspace.test.mjs tests/campaign-voice.test.mjs tests/campaign.test.mjs tests/campaign-ai-usage.test.mjs tests/campaign-actions.test.mjs tests/campaign-scene-context.test.mjs tests/world.test.mjs tests/world-connections.test.mjs tests/scene-library.test.mjs tests/premium-client.test.mjs tests/premium-device.test.mjs tests/print-export-validation.test.mjs
      - run: node --check src/world-ui.js
      - run: node --check desktop/main.cjs
